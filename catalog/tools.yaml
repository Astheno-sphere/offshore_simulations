# Tool catalog for offshore_simulations. Source of truth: edit here, then `python tools/catalog_build.py`
# regenerates docs/TOOLS.md. Scanned 2026-11-06 (GitHub search by stars/topics + web). Stars are not stored: they go stale.
#
# status:  tested    = ran in this repo's workspace, result recorded
#          installed = pip/npm installs here, not exercised yet
#          candidate = fits a planned step; read code + licence before adopting
#          manual    = data you order/download by hand
#          watch     = interesting, not on the plan yet
# runs:    here (Claude workspace) | actions (GitHub runner) | laptop | browser
# priority: now (first paper) | next (first 3 papers) | later
# licence: "check" = not verified; read LICENSE before any copy. GPL/AGPL = separate process, never imported.

layers:
  world: Geography the scenario runs in (land, depth, lanes, installations)
  traffic: Real vessel movements (AIS) to validate simulated routes and speeds
  metocean: Wind, waves, currents; weather windows for operations
  solver: Exact and heuristic optimisation for routing and scheduling
  weather-routing: Route optimisation through forecast weather
  simulation: Time, queues, failures, weather delays (discrete-event, agent-based, vessel dynamics)
  offshore-energy: Domain models for offshore wind/oil and gas logistics
  emissions: Fuel, energy and emissions from vessel activity
  render: Maps and 3D scenes from validated trajectories
  video: Assembling frames, captions and explainers into posts
  assets: Free 3D models and textures for the cartoony look
  design: Visual systems and UI for maritime displays
  mcp: Connectors that let Claude drive desktop tools
  skills: Claude Code skills that encode know-how
  benchmarks: Instances and papers to reproduce

tools:

# Builds the machine image (Dockerfile) and publishes it to GitHub Container Registry. Codespaces, CI and any agent
# use the same image, so "works here" means the same thing everywhere.
name: machine-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, "requirements*.txt", constraints.txt, .devcontainer/**, .github/workflows/machine-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/astheno-sphere/offsim:latest,ghcr.io/astheno-sphere/offsim:${{ github.sha }}
      - name: Smoke test inside the image, cheap, not the full suite
        run: |
          docker run --rm ghcr.io/astheno-sphere/offsim:${{ github.sha }} bash -c \
            "python -c 'import skia, cadquery, OCP, openclsim, pyvrp' && python -m offsim tools && python -m pytest -q tests/test_concordance.py tests/test_studio.py tests/test_doctor.py --timeout=120"

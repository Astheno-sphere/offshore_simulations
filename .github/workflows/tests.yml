name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-render.txt -r requirements-weather.txt -r requirements-engines.txt -r requirements-gis.txt -r requirements-physics.txt -r requirements-graphics.txt -r requirements-intake.txt
      - run: python tools/catalog_build.py --check
      - run: python -m pytest -q tests

  render-check:
    # renderer smoke test: builds the deck.gl bundle and draws frames headlessly; writes no images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-render.txt
      - run: python -m offsim.examples.toy_fjord --out out/toy
      - run: python offsim/render_deck/render.py --scene out/toy/scene.json --format draft --check --agents lineart
      - run: python offsim/render_deck/render.py --scene out/toy/scene.json --format draft --check --agents sprite

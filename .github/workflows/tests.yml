name: tests

on:
  push:
    branches: [main, "claude/**", "wip/**", "agent/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # skia-python and OCP need EGL/GL. Mirrors on new runner images flake: retry, and do not fail on the index alone
      - run: |
          for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update -q && break || sleep 15; done
          sudo apt-get install -y -q libegl1 libgl1 libfontconfig1 || sudo apt-get install -y -q --fix-missing libegl1 libgl1 libfontconfig1
      - run: pip install -r requirements-render.txt -r requirements-weather.txt -r requirements-engines.txt -r requirements-gis.txt -r requirements-physics.txt -r requirements-graphics.txt -r requirements-intake.txt -r requirements-cad.txt
      - run: python -c "import skia, cadquery, OCP; print('graphics + cad ok')"
      - run: python tools/catalog_build.py --check
      - run: python -m pytest -q tests

  render-check:
    # renderer smoke test: builds the deck.gl bundle and draws frames headlessly; writes no images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-render.txt
      - run: python -m offsim.examples.toy_fjord --out out/toy
      - run: python offsim/render_deck/render.py --scene out/toy/scene.json --format draft --check --agents lineart
      - run: python offsim/render_deck/render.py --scene out/toy/scene.json --format draft --check --agents sprite

paper:
  id: irinagribkovskaia-2025-tactical-helicopter
  title: Tactical Helicopter Transportation Planning for Offshore Personnel on the
    Norwegian Continental Shelf
  authors:
  - Irina Gribkovskaia
  - Gaute Oiestad Slettemark
  year: 2025
  doi: 10.3390/logistics9020073
  licence: CC BY 3.0
param:
  instance: stavanger
  choices:
  - floro
  - stavanger
  - bergen
  how: python -m offsim.solve.whelp --write-scenario <name> (instances.yaml is the
    single source)
problem:
  class:
  - WFPPP
  objective:
    value: min fixed window costs + flight-hour costs of the weekly program
    src: p.15 eq (1)
solver: whelp
engine: air
world: none
fleet:
- cls: helicopter
  count:
    value: 3
    src: p.26 Table 2 (helicopters available)
  speed_mps:
    value: 64.306
    src: p.25 Sec 6.2.1 (125 kn)
  domain: air
instance:
  source: paper Appendix A + assumed positions
  base:
    name: Stavanger
    lon: 5.6378
    lat: 58.8767
    assumption: true
    note: approximate airport reference point, unverified
  stops:

sim:
  wfppp:
    slot_min:
      value: 15
      src: p.25 Sec 6.2.1
    speed_kn:
      value: 125
      src: p.25 Sec 6.2.1 (S-92 average speed)
    deck_min:
      value: 10
      src: p.25 Sec 6.2.1 (about ten minutes per deck stop)
    turnaround_min:
      value: 60
      src: p.25 Sec 6.2.1 (one hour added to each flight)
    split_threshold_min:
      value: 15
      src: p.25 Sec 6.2.1
    flight_hour_cost:
      value: 140
      src: p.25 Sec 6.2.1 (masked units)
    days:
      value: 5
      src: p.12 Sec 3 (Monday to Friday)
    day_start:
      value: 07:00
      src: p.26 (windows start at 07:00)
    heliport_name: Stavanger
    max_helicopters:
      value: 3
      src: p.26 Table 2
    windows:
    - hours:
        value: 10
        src: p.26 (options (10, 12, 14, 16))
      cost:
        value: 5968
        src: p.26 Table 3
    - hours:
        value: 12
        src: p.26 (options (10, 12, 14, 16))

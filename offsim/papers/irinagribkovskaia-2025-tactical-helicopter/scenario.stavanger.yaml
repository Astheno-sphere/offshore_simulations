    lon: 2.85348
    lat: 59.18158
    assumption: true
  - name: S8
    lon: 2.5464
    lat: 58.09022
    assumption: true
  - name: S9
    lon: 3.28777
    lat: 57.78406
    assumption: true
  - name: S10
    lon: 2.26294
    lat: 58.83384
    assumption: true
  - name: S11
    lon: 2.01087
    lat: 58.65607
    assumption: true
  - name: S12
    lon: 2.87867
    lat: 59.37409

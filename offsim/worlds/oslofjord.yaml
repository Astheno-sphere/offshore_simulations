# Inner and outer Oslofjord: ferries, port logistics, crew/worker boats, PSV approaches.
bbox: [10.20, 58.95, 11.05, 59.95]   # west, south, east, north (WGS84)
osm_land: true
sodir_keywords: []                    # no petroleum installations in the fjord
# Depth (fetch_world --depth). crs = merge grid. kartverket_dtm.metadata_uuid is the Geonorge dataset UUID of "DTM 10
# Terrengmodell (UTM32)" (the Oslofjord and the Rogaland coast both lie in zone 32); the fetcher checks it against
# /api/capabilities at run time and stops with "endpoint unverified" if Geonorge does not know it.
depth:
  crs: EPSG:25832
  emodnet: {}                          # coverage id discovered from GetCapabilities (newest emodnet__mean*)
  kartverket_dtm:
    metadata_uuid: fd851873-f363-46f9-9fc6-bb1b403575df
    projection_code: "25832"
    name: Kartverket DTM 10 (UTM32)
    licence: CC BY 4.0
manual:
  - name: NGU bathymetry, inner Oslofjord, 1 m grid
    where: geonorge.no (search "Dybdedata Oslofjorden 1m")
    use: seabed relief; depth-limited lanes
  - name: Kartverket Sjøkart - Dybdedata (open)
    where: geonorge.no download (GeoJSON/GML/FGDB); not approved for navigation
    use: depth areas and contours for lane graph
  - name: Kystverket Historic AIS (HAIS)
    where: https://hais.kystverket.no/ (order an area/time/ship type, GeoParquet link by e-mail)
    use: validate simulated routes and speeds against real traffic
  - name: Kystverket reference routes for navigation
    where: data.norge.no "Reference routes for navigation" (NLOD)
    use: sea-lane graph for routing instead of straight lines

# Seeded-fault base scenario (tests/test_seeded_faults.py): VRPTW twin of cvrp_tiny.yaml. Speed 5 m/s, service 600 s, so a
# stop 2 km out is reached at t = 400 s. Windows [earliest, latest] are on service START (the standard rule). A feasible plan
# is [[1, 2], [3, 4]]; the route [2, 1] reaches S1 at 1800 s, after its window closes at 1000 s.

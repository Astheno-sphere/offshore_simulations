  id: seeded-fixture-vrptw
  title: seeded-fault fixture
  authors: []
  year: 2026
  doi: ''
  licence: MIT (synthetic)
problem:
  class:
  - VRPTW
  objective: total distance sailed
  constraints:
  - name: capacity
    formula_or_text: sum of demand on a route <= vessel capacity
    assumption: true
  - name: time_window
    formula_or_text: service at stop i starts within [early_i, late_i]
    assumption: true
  solver: pyvrp
world: none
